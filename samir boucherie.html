<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMIR BOUCHERIE EL BORJ - Menu & Commande</title>
    <!-- Google Fonts & FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b0000;
            --primary-dark: #5c0000;
            --accent: #d4af37;
            --accent-light: #f3e5ab;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --bg-card-hover: #262626;
            --text-light: #f5f5f5;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --whatsapp-green: #25d366;
            --whatsapp-green-hover: #1da851;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 120px;
            background-image: radial-gradient(#222 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Header / Banner */
        header {
            background: linear-gradient(135deg, #1a0000 0%, #4a0000 50%, #1a0000 100%);
            border-bottom: 3px solid var(--accent);
            text-align: center;
            padding: 40px 20px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .header-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 600;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
            margin-bottom: 8px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
        }

        .header-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--accent-light);
        }

        .header-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Container & Search */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 15px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .category-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .pill {
            background: #121212;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .pill.active, .pill:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .title-group {
            flex: 1;
        }

        .card h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .card .title-ar {
            font-size: 0.9rem;
            color: var(--accent);
            direction: rtl;
            text-align: right;
            display: block;
            margin-top: 2px;
            font-weight: 500;
        }

        .price-badge {
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid rgba(139, 0, 0, 0.6);
            color: #ff6b6b;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .card-controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .qty-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121212;
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .qty-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            background: #2a2a2a;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-qty:hover {
            background: var(--primary);
        }

        .select-weight {
            background: #2a2a2a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .item-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-preview {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .calc-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-add:hover {
            background: #a00000;
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        /* Floating Cart Bar */
        .cart-float-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 800px;
            background: linear-gradient(135deg, #1e1e1e 0%, #2a0000 100%);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 99;
            backdrop-filter: blur(10px);
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-icon-wrapper {
            position: relative;
            background: var(--primary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: #000;
            font-weight: 800;
            font-size: 0.75rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-details {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-light);
        }

        .btn-whatsapp {
            background: var(--whatsapp-green);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: all 0.3s;
        }

        .btn-whatsapp:hover {
            background: var(--whatsapp-green-hover);
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        /* Cart Modal Drawer */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.active {
            display: flex;
        }

        .cart-modal {
            background: var(--bg-card);
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(139, 0, 0, 0.15);
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--accent-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .cart-items-list {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            background: #121212;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .cart-item-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cart-item-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cart-item-price {
            font-weight: 700;
            color: var(--accent);
        }

        .btn-remove {
            background: rgba(255, 0, 0, 0.2);
            color: #ff5555;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: #151515;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .customer-notes {
            width: 100%;
            padding: 10px;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
            resize: none;
            outline: none;
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 0.95rem;
        }

        @media (min-width: 600px) {
            .modal-overlay {
                align-items: center;
            }
            .cart-modal {
                border-radius: 20px;
                max-height: 80vh;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Banner -->
    <header>
        <div class="header-badge"><i class="fa-solid fa-drumstick-bite"></i> Boucherie Halal Premier</div>
        <h1>SAMIR BOUCHERIE <span>EL BORJ</span></h1>
        <p>Viandes fraîches de haute qualité & Découpe sur mesure</p>
        <div class="header-info">
            <span><i class="fa-solid fa-phone"></i> +212 646-897111</span>
            <span><i class="fa-solid fa-location-dot"></i> Quartier El Borj</span>
        </div>
    </header>

    <div class="container">
        <!-- Controls: Search & Categories -->
        <div class="controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Rechercher une viande..." oninput="filterItems()">
            </div>
            <div class="category-pills">
                <button class="pill active" onclick="filterCategory('all', this)">Tous</button>
                <button class="pill" onclick="filterCategory('viande', this)">Viandes</button>
                <button class="pill" onclick="filterCategory('hache', this)">Hachés</button>
                <button class="pill" onclick="filterCategory('specialite', this)">Spécialités</button>
            </div>
        </div>

        <!-- Menu Grid -->
        <div class="menu-grid" id="menuGrid">
            <!-- Items rendered via JS -->
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="cart-float-bar">
        <div class="cart-info" onclick="toggleCartModal()">
            <div class="cart-icon-wrapper">
                <i class="fa-solid fa-basket-shopping" style="color: white;"></i>
                <div class="cart-badge" id="cartBadge">0</div>
            </div>
            <div class="cart-details">
                <span class="cart-count" id="cartCountText">0 articles sélectionnés</span>
                <span class="cart-total" id="cartTotalText">0.00 DH</span>
            </div>
        </div>
        <button class="btn-whatsapp" onclick="sendWhatsAppOrder()">
            <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i>
            Commander
        </button>
    </div>

    <!-- Cart Modal Drawer -->
    <div class="modal-overlay" id="cartModalOverlay" onclick="closeCartModal(event)">
        <div class="cart-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2><i class="fa-solid fa-cart-shopping"></i> Mon Panier</h2>
                <button class="btn-close" onclick="toggleCartModal()">&times;</button>
            </div>
            <div class="cart-items-list" id="cartItemsList">
                <!-- Cart Items rendered via JS -->
            </div>
            <div class="modal-footer">
                <textarea id="customerNotes" class="customer-notes" rows="2" placeholder="Instructions spéciales (ex: découpe fine, sans matière grasse, etc.)..."></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <span style="color: var(--text-muted);">Total de la commande:</span>
                    <span id="modalGrandTotal" style="font-size: 1.3rem; font-weight: 700; color: var(--accent);">0.00 DH</span>
                </div>
                <button class="btn-whatsapp" style="width: 100%; justify-content: center; padding: 14px; font-size: 1rem;" onclick="sendWhatsAppOrder()">
                    <i class="fa-brands fa-whatsapp" style="font-size: 1.4rem;"></i>
                    Envoyer la commande via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // Raw Data based on Image Rates (per 1 Kg)
        const productsData = [
            { id: 1,  nameFr: "Viande d'agneau",           nameAr: "لحم الغنم",            priceKg: 140, category: "viande" },
            { id: 2,  nameFr: "Viande de chèvre",          nameAr: "لحم الماعز",           priceKg: 130, category: "viande" },
            { id: 3,  nameFr: "Viande de veau",            nameAr: "لحم البقر",            priceKg: 120, category: "viande" },
            { id: 4,  nameFr: "Steak haché",               nameAr: "كفتة",                priceKg: 130, category: "hache" },
            { id: 5,  nameFr: "Steak haché diététique",     nameAr: "كفتة رجيم",           priceKg: 140, category: "hache" },
            { id: 6,  nameFr: "Steak",                     nameAr: "هبرة",                priceKg: 140, category: "viande" },
            { id: 7,  nameFr: "Foie",                      nameAr: "كبدة",                priceKg: 170, category: "specialite" },
            { id: 8,  nameFr: "Saucisses",                 nameAr: "صوحيص",               priceKg: 110, category: "hache" },
            { id: 9,  nameFr: "Côtelettes",                nameAr: "كوتليط",              priceKg: 150, category: "viande" },
            { id: 10, nameFr: "Steak de dinde",            nameAr: "هبرة داند",           priceKg: 70,  category: "viande" },
            { id: 11, nameFr: "Filet",                     nameAr: "فيلي",                priceKg: 170, category: "viande" },
            { id: 12, nameFr: "Faux filet",                nameAr: "فوفيلي",              priceKg: 160, category: "viande" },
            { id: 13, nameFr: "Cœur",                      nameAr: "قلب",                 priceKg: 160, category: "specialite" },
            { id: 14, nameFr: "Entrecôte",                 nameAr: "لونتروكوت",           priceKg: 130, category: "viande" },
            { id: 15, nameFr: "Brochettes aux épices",     nameAr: "بروشيت بالعطرية",      priceKg: 160, category: "hache" },
            { id: 16, nameFr: "Rate",                      nameAr: "طحال",                priceKg: 90,  category: "specialite" },
            { id: 17, nameFr: "Rate garni",                nameAr: "طحال معمر",           priceKg: 120, category: "specialite" },
            { id: 18, nameFr: "Cervelle",                 nameAr: "مخ",                  priceKg: 60,  category: "specialite" }
        ];

        // State variables
        let cart = [];
        let currentCategory = 'all';

        // Initialize UI
        function initMenu() {
            renderGrid(productsData);
            updateCartUI();
        }

        // Render Menu Items
        function renderGrid(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Aucun article trouvé.</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <div class="title-group">
                                <h3>${item.nameFr}</h3>
                                <span class="title-ar">${item.nameAr}</span>
                            </div>
                            <span class="price-badge">${item.priceKg} DH/Kg</span>
                        </div>
                    </div>
                    
                    <div class="card-controls">
                        <div class="qty-selector">
                            <span class="qty-label">Quantité</span>
                            <div class="qty-controls">
                                <button class="btn-qty" onclick="changeTempQty(${item.id}, -1)">-</button>
                                <span id="qty-val-${item.id}" style="font-weight:600; min-width: 20px; text-align:center;">1</span>
                                <button class="btn-qty" onclick="changeTempQty(${item.id}, 1)">+</button>
                            </div>
                        </div>

                        <div class="qty-selector">
                            <span class="qty-label">Poids / Unité</span>
                            <select class="select-weight" id="unit-val-${item.id}" onchange="updateCardCalc(${item.id})">
                                <option value="0.5">500 g (1/2 Kg)</option>
                                <option value="1" selected>1 Kg</option>
                                <option value="1.5">1.5 Kg</option>
                                <option value="2">2 Kg</option>
                                <option value="2.5">2.5 Kg</option>
                                <option value="3">3 Kg</option>
                                <option value="5">5 Kg</option>
                            </select>
                        </div>

                        <div class="item-total-row">
                            <span class="calc-preview" id="calc-preview-${item.id}">1 × 1 Kg</span>
                            <span class="calc-price" id="calc-price-${item.id}">${item.priceKg.toFixed(2)} DH</span>
                        </div>

                        <button class="btn-add" onclick="addToCart(${item.id})">
                            <i class="fa-solid fa-cart-plus"></i> Ajouter au panier
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Card Live Calculations
        function changeTempQty(id, delta) {
            const qtyElem = document.getElementById(`qty-val-${id}`);
            let current = parseInt(qtyElem.innerText);
            current = Math.max(1, current + delta);
            qtyElem.innerText = current;
            updateCardCalc(id);
        }

        function updateCardCalc(id) {
            const product = productsData.find(p => p.id === id);
            const count = parseInt(document.getElementById(`qty-val-${id}`).innerText);
            const weightUnit = parseFloat(document.getElementById(`unit-val-${id}`).value);
            
            const totalKg = count * weightUnit;
            const totalPrice = totalKg * product.priceKg;

            const unitText = weightUnit === 0.5 ? "500g" : `${weightUnit}Kg`;
            document.getElementById(`calc-preview-${id}`).innerText = `${count} × ${unitText} (${totalKg} Kg)`;
            document.getElementById(`calc-price-${id}`).innerText = `${totalPrice.toFixed(2)} DH`;
        }

        // Cart Actions
        function addToCart(id) {
            const product = productsData.find(p => p.id === id);
            const count = parseInt(document.getElementById(`qty-val-${id}`).innerText);
            const weightUnit = parseFloat(document.getElementById(`unit-val-${id}`).value);
            const totalKg = count * weightUnit;
            const itemPrice = totalKg * product.priceKg;

            // Check if item with same weight unit exists
            const existingIndex = cart.findIndex(ci => ci.id === id && ci.weightUnit === weightUnit);
            
            if (existingIndex > -1) {
                cart[existingIndex].count += count;
                cart[existingIndex].totalKg += totalKg;
                cart[existingIndex].itemPrice += itemPrice;
            } else {
                cart.push({
                    id: product.id,
                    nameFr: product.nameFr,
                    nameAr: product.nameAr,
                    priceKg: product.priceKg,
                    count: count,
                    weightUnit: weightUnit,
                    totalKg: totalKg,
                    itemPrice: itemPrice
                });
            }

            updateCartUI();
            
            // Temporary feedback effect
            const floatBar = document.querySelector('.cart-float-bar');
            floatBar.style.transform = 'translateX(-50%) scale(1.03)';
            setTimeout(() => {
                floatBar.style.transform = 'translateX(-50%) scale(1)';
            }, 200);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const cartCountText = document.getElementById('cartCountText');
            const cartTotalText = document.getElementById('cartTotalText');
            const modalGrandTotal = document.getElementById('modalGrandTotal');
            const cartItemsList = document.getElementById('cartItemsList');

            const totalItemsCount = cart.reduce((sum, item) => sum + item.count, 0);
            const grandTotal = cart.reduce((sum, item) => sum + item.itemPrice, 0);

            badge.innerText = totalItemsCount;
            cartCountText.innerText = `${cart.length} référence(s) selected`;
            cartTotalText.innerText = `${grandTotal.toFixed(2)} DH`;
            modalGrandTotal.innerText = `${grandTotal.toFixed(2)} DH`;

            // Modal List Render
            if (cart.length === 0) {
                cartItemsList.innerHTML = '<div class="empty-cart-msg"><i class="fa-solid fa-basket-shopping" style="font-size: 2rem; margin-bottom: 10px; display:block;"></i>Votre panier est vide</div>';
            } else {
                cartItemsList.innerHTML = '';
                cart.forEach((item, index) => {
                    const unitText = item.weightUnit === 0.5 ? "500g" : `${item.weightUnit} Kg`;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div>
                            <div class="cart-item-title">${item.nameFr} (${item.nameAr})</div>
                            <div class="cart-item-sub">Quantité: ${item.count} × ${unitText} = <strong>${item.totalKg} Kg</strong></div>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="cart-item-price">${item.itemPrice.toFixed(2)} DH</span>
                            <button class="btn-remove" onclick="removeFromCart(${index})">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    cartItemsList.appendChild(itemDiv);
                });
            }
        }

        // Cart Drawer Modal Toggle
        function toggleCartModal() {
            const overlay = document.getElementById('cartModalOverlay');
            overlay.classList.toggle('active');
        }

        function closeCartModal(e) {
            if (e.target.id === 'cartModalOverlay') {
                document.getElementById('cartModalOverlay').classList.remove('active');
            }
        }

        // WhatsApp Order Generation
        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("Votre panier est vide. Veuillez ajouter des produits avant de commander.");
                return;
            }

            const phone = "212646897111";
            let message = `*SAMIR BOUCHERIE EL BORJ*
`;
            message += `------------------------------------
`;
            message += `*Nouvelle Commande:* 

`;

            cart.forEach((item, i) => {
                const unitText = item.weightUnit === 0.5 ? "500g" : `${item.weightUnit}Kg`;
                message += `${i + 1}. *${item.nameFr}* (${item.nameAr})
`;
                message += `   • Quantité: ${item.count} × ${unitText} (${item.totalKg} Kg Total)
`;
                message += `   • Prix: ${item.itemPrice.toFixed(2)} DH

`;
            });

            const grandTotal = cart.reduce((sum, item) => sum + item.itemPrice, 0);
            message += `------------------------------------
`;
            message += `*TOTAL À PAYER: ${grandTotal.toFixed(2)} DH*
`;

            const notes = document.getElementById('customerNotes').value.trim();
            if (notes) {
                message += `
*Note / Instructions:* ${notes}
`;
            }

            message += `
Merci de me confirmer la disponibilité et le temps de préparation!`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        // Filters & Search
        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = productsData.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchQuery = p.nameFr.toLowerCase().includes(query) || p.nameAr.includes(query);
                return matchCat && matchQuery;
            });
            renderGrid(filtered);
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            filterItems();
        }

        // On Load
        window.onload = initMenu;
    </script>
</body>
</html>
